[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-arena"
version = "0.1.0"
description = "Deterministic synthetic city snapshot for Urban Twin Arena MVP 0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["urban_arena*"]
