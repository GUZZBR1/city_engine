[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-simulation"
version = "0.1.0"
description = "Reproducible SUMO adapter for synthetic city snapshots"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "urban-arena>=0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*"]
