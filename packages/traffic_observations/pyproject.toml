[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-observations"
version = "0.1.0"
description = "Canonical traffic observations, source adapters, and historical replay"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_observations*"]
