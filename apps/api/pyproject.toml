[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-arena-api"
version = "0.1.0"
description = "FastAPI interface for the Urban Twin Arena MVP 0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "urban-arena>=0.1,<1",
  "urban-simulation>=0.1,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv.sources]
urban-arena = { path = "../../packages/urban_arena", editable = true }
urban-simulation = { path = "../../packages/simulation", editable = true }
