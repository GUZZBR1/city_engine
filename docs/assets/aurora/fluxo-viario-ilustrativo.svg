<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Conceito visual de fluxo na rede viária de Aurora</title>
  <desc id="desc">Ilustração sem dados reais ou resultados do SUMO: uma rede urbana esquemática com corredores, pontos que representam veículos e dois cruzamentos de referência.</desc>
  <defs>
    <pattern id="blocks" width="104" height="92" patternUnits="userSpaceOnUse"><rect x="12" y="12" width="78" height="64" rx="8" fill="#dbe9df" stroke="#bad0c2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#183d38" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b76c42"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f5f4ef"/>
  <text x="58" y="62" fill="#a15d35" font-family="monospace" font-size="14" letter-spacing="3">MOBILIDADE / ILUSTRAÇÃO CONCEITUAL</text>
  <text x="58" y="106" fill="#183d38" font-family="sans-serif" font-size="31" font-weight="700">Ler a rede antes de comparar intervenções</text>
  <g filter="url(#shadow)"><rect x="58" y="140" width="1084" height="352" rx="20" fill="#fffefa"/></g>
  <rect x="86" y="166" width="690" height="300" rx="14" fill="url(#blocks)"/>
  <g stroke="#52616b" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M130 212H730M130 312H730M130 412H730"/>
    <path d="M170 184V448M370 184V448M570 184V448M730 184V448"/>
  </g>
  <g stroke="#f2a15d" stroke-width="3" stroke-dasharray="12 10" fill="none">
    <path d="M130 212H730M370 184V448"/>
  </g>
  <path d="M196 212H324M388 312H510M590 412H696" stroke="#f3c09a" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <path d="M370 438V344M570 284V215" stroke="#f3c09a" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <g fill="#2d628d" stroke="#fffefa" stroke-width="3">
    <circle cx="208" cy="212" r="9"/><circle cx="258" cy="212" r="9"/><circle cx="422" cy="312" r="9"/><circle cx="470" cy="312" r="9"/>
    <circle cx="620" cy="412" r="9"/><circle cx="370" cy="385" r="9"/><circle cx="570" cy="247" r="9"/>
  </g>
  <g fill="#b76c42" stroke="#fffefa" stroke-width="3"><circle cx="370" cy="312" r="13"/><circle cx="570" cy="312" r="13"/></g>
  <g font-family="monospace" font-size="12" fill="#5e716b">
    <text x="106" y="454">SETOAS TRACEJADAS: CORREDORES</text>
    <text x="642" y="454">● VEÍCULOS</text>
  </g>
  <rect x="815" y="166" width="298" height="300" rx="16" fill="#183d38"/>
  <text x="842" y="207" fill="#bdd7c9" font-family="monospace" font-size="12" letter-spacing="2">O QUE A IMAGEM MOSTRA</text>
  <text x="842" y="250" fill="#fffefa" font-family="sans-serif" font-size="18">Uma forma de representar</text>
  <text x="842" y="277" fill="#fffefa" font-family="sans-serif" font-size="18">rede, movimentos e sinais</text>
  <text x="842" y="304" fill="#fffefa" font-family="sans-serif" font-size="18">em uma simulação 2D.</text>
  <path d="M842 327H1085" stroke="#4f7066"/>
  <text x="842" y="365" fill="#f3c09a" font-family="sans-serif" font-size="16" font-weight="700">Imagem conceitual</text>
  <text x="842" y="393" fill="#bdd7c9" font-family="sans-serif" font-size="14">Não é saída do SUMO,</text>
  <text x="842" y="416" fill="#bdd7c9" font-family="sans-serif" font-size="14">não contém dados ou métricas</text>
  <text x="842" y="439" fill="#bdd7c9" font-family="sans-serif" font-size="14">de uma execução.</text>
  <text x="58" y="527" fill="#5e716b" font-family="sans-serif" font-size="14">Ilustração editorial para explicar a leitura da rede; símbolos e rotas não correspondem a resultados calculados.</text>
</svg>
