<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Como funciona uma comparação SUMO pareada</title>
  <desc id="desc">O mesmo snapshot sintético, demanda, janela, semente e versão do SUMO alimentam dois cenários: baseline e uma intervenção. Os resultados da janela são comparados por métrica, sem converter em efeito anual.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#183d38" flood-opacity=".1"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#82968d"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="#f5f4ef"/>
  <text x="58" y="65" fill="#a15d35" font-family="monospace" font-size="14" letter-spacing="3">MÉTODO / COMPARAÇÃO PAREADA</text>
  <text x="58" y="110" fill="#183d38" font-family="sans-serif" font-size="32" font-weight="700">Muda-se a intervenção; as condições ficam iguais</text>
  <g filter="url(#shadow)"><rect x="58" y="164" width="230" height="244" rx="18" fill="#183d38"/></g>
  <text x="84" y="202" fill="#bdd7c9" font-family="monospace" font-size="12" letter-spacing="2">ENTRADAS CONGELADAS</text>
  <text x="84" y="246" fill="#fffefa" font-family="sans-serif" font-size="17">Snapshot Aurora</text>
  <text x="84" y="281" fill="#fffefa" font-family="sans-serif" font-size="17">Demanda e janela</text>
  <text x="84" y="316" fill="#fffefa" font-family="sans-serif" font-size="17">Semente aleatória</text>
  <text x="84" y="351" fill="#fffefa" font-family="sans-serif" font-size="17">Versão / limites SUMO</text>
  <text x="84" y="384" fill="#bdd7c9" font-family="monospace" font-size="12">EXPERIMENTO SINTÉTICO</text>
  <path d="M300 283H360M360 283V225H405M360 283V346H405" fill="none" stroke="#82968d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="422" y="168" width="253" height="112" rx="16" fill="#fffefa"/><rect x="422" y="298" width="253" height="112" rx="16" fill="#fffefa"/></g>
  <text x="448" y="205" fill="#a15d35" font-family="monospace" font-size="12" letter-spacing="2">CENÁRIO A</text>
  <text x="448" y="241" fill="#183d38" font-family="sans-serif" font-size="23" font-weight="700">Baseline</text>
  <text x="448" y="265" fill="#5e716b" font-family="sans-serif" font-size="14">plano sem intervenção</text>
  <text x="448" y="335" fill="#a15d35" font-family="monospace" font-size="12" letter-spacing="2">CENÁRIO B</text>
  <text x="448" y="371" fill="#183d38" font-family="sans-serif" font-size="23" font-weight="700">Intervenção</text>
  <text x="448" y="395" fill="#5e716b" font-family="sans-serif" font-size="14">override semafórico declarado</text>
  <path d="M688 224H745M688 354H745M745 224V354" fill="none" stroke="#82968d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="764" y="218" width="183" height="145" rx="16" fill="#dbe9df" stroke="#9ebcad" stroke-width="2"/></g>
  <text x="790" y="258" fill="#1a4942" font-family="monospace" font-size="12" letter-spacing="2">SUMO</text>
  <text x="790" y="293" fill="#183d38" font-family="sans-serif" font-size="20" font-weight="700">Métricas por</text>
  <text x="790" y="320" fill="#183d38" font-family="sans-serif" font-size="20" font-weight="700">janela</text>
  <text x="790" y="346" fill="#5e716b" font-family="sans-serif" font-size="13">com proveniência</text>
  <path d="M958 290H1000" fill="none" stroke="#82968d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1018" y="218" width="128" height="145" rx="16" fill="#fffefa"/></g>
  <text x="1040" y="258" fill="#a15d35" font-family="monospace" font-size="12" letter-spacing="2">DELTA</text>
  <text x="1040" y="294" fill="#183d38" font-family="sans-serif" font-size="18" font-weight="700">A vs. B</text>
  <text x="1040" y="322" fill="#5e716b" font-family="sans-serif" font-size="13">sem score</text>
  <text x="1040" y="343" fill="#5e716b" font-family="sans-serif" font-size="13">universal</text>
  <rect x="58" y="438" width="1088" height="48" rx="12" fill="#fff2e7"/>
  <text x="82" y="468" fill="#804521" font-family="sans-serif" font-size="15" font-weight="600">O delta descreve apenas esta janela sintética: não é medição de campo, previsão validada nem efeito anual.</text>
</svg>
